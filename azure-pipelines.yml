stages:
- stage: Build
  displayName: 'Build & Package App'
  jobs:
  - job: BuildJob
    pool:
      name: 'Default' # Uses your wolfweb1 agent
    steps:
    # 1. Ensure .NET SDK is present on the agent
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    # 2. Explicitly restore NuGet packages
    - script: dotnet restore
      displayName: 'Restore NuGet Packages'

    # 3. Publish the application specifying the solution/csproj file
    - script: dotnet publish --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish .NET Web Application'

    # 4. Publish artifact for deployment
    - publish: $(Build.ArtifactStagingDirectory)/publish
      artifact: drop